# Railway/Nixpacks — Express API from monorepo root (see railway.toml)
[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-10_x", "fontconfig", "dejavu_fonts"]

# Production default skips devDependencies; backend build needs typescript (tsc).
[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm install --frozen-lockfile --prod=false",
]
