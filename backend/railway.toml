# Railway config file path: backend/railway.toml
# Settings → Root Directory: leave EMPTY (monorepo root). Do not set Root Directory to backend.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --dir backend/services run build && pnpm --dir backend run build"

[deploy]
startCommand = "node backend/lib/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
