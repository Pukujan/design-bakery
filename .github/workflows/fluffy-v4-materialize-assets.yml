name: Materialize Fluffy V4 image assets

on:
  push:
    branches:
      - fix/fluffy-v4-hires-assets
    paths:
      - .asset-staging/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decode staged WebP assets
        shell: bash
        run: |
          set -euo pipefail
          out='frontend/public/experiments/fluffy-system-v4/assets'
          mkdir -p "$out"
          for slug in \
            fluffy-study-partner \
            fluffy-editorial \
            fluffy-3d \
            pam-preflight \
            pam-proof \
            ra-control-room \
            ra-lab \
            mixed-media
          do
            src=".asset-staging/${slug}.b64"
            test -s "$src"
            base64 --decode "$src" > "$out/${slug}.webp"
          done

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          out = Path('frontend/public/experiments/fluffy-system-v4/assets')
          expected = {
              'fluffy-study-partner.webp',
              'fluffy-editorial.webp',
              'fluffy-3d.webp',
              'pam-preflight.webp',
              'pam-proof.webp',
              'ra-control-room.webp',
              'ra-lab.webp',
              'mixed-media.webp',
          }
          files = {p.name for p in out.glob('*.webp')}
          if files != expected:
              raise SystemExit(f'asset set mismatch: {sorted(files)}')
          for name in sorted(expected):
              data = (out / name).read_bytes()
              if len(data) < 16 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'invalid WebP: {name}')
              print(name, len(data), 'bytes')
          PY

      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .asset-staging/*.b64 .asset-staging/READY
          git add -A .asset-staging frontend/public/experiments/fluffy-system-v4/assets
          git commit -m 'Add Fluffy V4 source render assets'
          git push origin HEAD:${{ github.ref_name }}
