name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript and TypeScript
        run: pnpm lint

      # The research charts render from committed bytes, so these three checks
      # run before the build regenerates anything: they are what catches a
      # data file, a generated type or a static SVG that has drifted from the
      # spec that produced it.
      - name: Verify research chart data against its manifest
        run: pnpm research:sync-data --check

      - name: Verify generated chart types are current
        run: pnpm research:gen-types --check

      - name: Verify research chart assets are current
        run: pnpm research:validate-charts --check

      - name: Build frontend
        run: pnpm run build

      - name: Type-check frontend
        run: pnpm --dir frontend run typecheck

      - name: Build backend and services
        run: pnpm --dir backend run build

      - name: Run publish-kit font diagnostics smoke test
        run: pnpm --dir backend/services run test:publish-kit-fonts

      - name: Check homepage content stability
        run: pnpm test:homepage-content

      - name: Test research charts
        run: pnpm test:research-charts
