name: CI

on:
  # Every PR, not just those based on main: stacked PRs (base = another task
  # branch) must be verified too. Without this, a PR stacked on a feature
  # branch never runs CI and can be merged unverified.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript and TypeScript
        run: pnpm lint

      - name: Build frontend
        run: pnpm run build

      - name: Type-check frontend
        run: pnpm --dir frontend run typecheck

      - name: Build backend and services
        run: pnpm --dir backend run build

      - name: Check the agent post payload validation
        run: pnpm test:agent-posts

      - name: Run publish-kit font diagnostics smoke test
        run: pnpm --dir backend/services run test:publish-kit-fonts

      - name: Check homepage content stability
        run: pnpm test:homepage-content

      - name: Check the IRE page wiring and saved feed
        run: pnpm test:ire-page

      - name: Install Chromium for the IRE page browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the IRE page browser checks (feed, fallback, stale banner, mobile, color themes)
        run: pnpm test:ire-page:browser

  # Report-only for now: the detector is not in the required status checks, so it
  # surfaces orphaned files in the log without blocking merges. Promote it (add
  # `orphans` to branch protection and run `pnpm find:orphans:strict`) once the
  # existing orphans are cleaned up.
  orphans:
    name: orphans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Find orphaned source files
        run: node scripts/find-orphans.mjs
