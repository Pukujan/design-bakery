<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
  <title>Dumbbell chart of judge accuracy</title>
  <text class="chart-title" x="24" y="30" font-size="18">Scores on answered questions hide skipped ones</text>
  <text class="chart-subtitle" x="24" y="52" font-size="12">Holm-corrected McNemar accuracy by judge, with 95% CI</text>

  <g class="legend">
    <circle cx="470" cy="30" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="484" y="34" font-size="11">answered</text>
    <circle cx="560" cy="30" r="5" fill="#1a1a1a"/>
    <text x="574" y="34" font-size="11">all 760</text>
  </g>

  <g class="plot">
    <line class="connector" x1="150" y1="90" x2="420" y2="90" stroke="#1a1a1a"/>
    <circle class="dot dot-open" cx="150" cy="90" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle class="dot dot-filled" cx="420" cy="90" r="5" fill="#1a1a1a"/>
    <text class="row-label" x="24" y="94" font-size="12">DeepSeek V4 Flash</text>
    <text class="value-label" x="430" y="94" font-size="12">99.87%</text>

    <line class="connector" x1="160" y1="150" x2="410" y2="150" stroke="#1a1a1a"/>
    <circle class="dot dot-open" cx="160" cy="150" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle class="dot dot-filled" cx="410" cy="150" r="5" fill="#1a1a1a"/>
    <text class="row-label" x="24" y="154" font-size="12">GLM 5.2</text>
    <text class="value-label" x="420" y="154" font-size="12">94.9%</text>

    <line class="connector" x1="120" y1="210" x2="300" y2="210" stroke="#1a1a1a"/>
    <circle class="dot dot-open" cx="120" cy="210" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle class="dot dot-filled" cx="300" cy="210" r="5" fill="#1a1a1a"/>
    <text class="row-label" x="24" y="214" font-size="12">Qwen3.8 Flash, one pass</text>
    <text class="value-label" x="310" y="214" font-size="12">57.6%</text>

    <line class="connector" x1="100" y1="270" x2="240" y2="270" stroke="#1a1a1a"/>
    <circle class="dot dot-open" cx="100" cy="270" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle class="dot dot-filled" cx="240" cy="270" r="5" fill="#1a1a1a"/>
    <text class="row-label" x="24" y="274" font-size="12">Verdict 1.4 (local)</text>
    <text class="value-label" x="250" y="274" font-size="12">38.6%</text>

    <line class="connector" x1="90" y1="330" x2="200" y2="330" stroke="#1a1a1a"/>
    <circle class="dot dot-open" cx="90" cy="330" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle class="dot dot-filled" cx="200" cy="330" r="5" fill="#1a1a1a"/>
    <text class="row-label" x="24" y="334" font-size="12">Verdict pre-v1.4 (local)</text>
    <text class="value-label" x="210" y="334" font-size="12">34.9%</text>
  </g>

  <line class="reference-line" x1="300" y1="80" x2="300" y2="360" stroke="#5e6670" stroke-dasharray="4 4"/>
  <text class="reference-label" x="304" y="76" font-size="11">baseline 50.3%</text>

  <text class="annotation" x="440" y="120" font-size="11">Skipped questions change the ranking</text>
  <text class="annotation" x="440" y="140" font-size="11">The gap is largest for DeepSeek</text>
  <text class="annotation" x="440" y="160" font-size="11">Local models sit near the floor</text>
  <text class="annotation" x="440" y="180" font-size="11">Count every skip as a miss</text>

  <text class="axis-label" transform="translate(12,300) rotate(-45)" font-size="11">judge</text>

  <text class="chart-footer" x="24" y="388" font-size="10">Source: Eval Lab EXP-029 results (scripts/generate_benchmark_figures.py)</text>
</svg>
