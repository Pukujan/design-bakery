<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
  <title>Bar chart: share of 760 questions graded right, by judge</title>
  <text class="chart-title" x="24" y="30" font-size="18">Some AI graders skipped 4 in 10 questions</text>
  <text class="chart-subtitle" x="24" y="52" font-size="12">Share of all 760 questions graded right, by grader</text>

  <g class="plot">
    <rect class="bar series-a" x="200" y="80" width="454" height="26" fill="#1f6f8b"/>
    <text class="row-label" x="24" y="98" font-size="12">DeepSeek V4 Flash</text>
    <text class="value-label" x="662" y="98" font-size="12">80.3%</text>

    <rect class="bar series-a" x="200" y="130" width="536" height="26" fill="#1f6f8b"/>
    <text class="row-label" x="24" y="148" font-size="12">GLM 5.2</text>
    <text class="value-label" x="744" y="148" font-size="12">94.9%</text>

    <rect class="bar series-a" x="200" y="180" width="556" height="26" fill="#1f6f8b"/>
    <text class="row-label" x="24" y="198" font-size="12">Qwen3.8 Flash</text>
    <text class="value-label" x="764" y="198" font-size="12">98.4%</text>

    <rect class="bar series-b" x="200" y="230" width="326" height="26" fill="#c9772f"/>
    <text class="row-label" x="24" y="248" font-size="12">Qwen3.8 Flash, one pass</text>
    <text class="value-label" x="534" y="248" font-size="12">57.6%</text>

    <rect class="bar series-c" x="200" y="280" width="218" height="26" fill="#9aa9b8"/>
    <text class="row-label" x="24" y="298" font-size="12">Verdict 1.4 (local)</text>
    <text class="value-label" x="426" y="298" font-size="12">38.6%</text>
  </g>

  <line class="reference-line" x1="484" y1="70" x2="484" y2="320" stroke="#5e6670" stroke-dasharray="4 4"/>
  <text class="reference-label" x="420" y="66" font-size="11">Always giving the same answer scores 50.3%</text>

  <text class="annotation" x="24" y="340" font-size="11">DeepSeek V4 Flash answered 80% of the questions, so its score over all 760 is 80.3%.</text>

  <text class="chart-footer" x="24" y="372" font-size="10">Source: Eval Lab benchmark of 25 AI graders on 760 questions with known answers.</text>
</svg>
