# Railway service: deploy from REPO ROOT (Settings → Root Directory: empty or ".")
# Not backend/ — the lockfile and workspace live at the repository root.

[build]
builder = "NIXPACKS"
buildCommand = "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --dir backend/services run build && pnpm --dir backend run build"

[deploy]
startCommand = "node backend/lib/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
