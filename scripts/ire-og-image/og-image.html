<!doctype html>
<!--
  Source for frontend/public/ire/og-image.png, the 1200x630 social preview for /ire.
  Regenerate with: pnpm ire:og-image   (renders this file with Playwright's Chromium)
  Colors come from the page's dark theme in frontend/public/ire/theme.css.
  Fonts: Inter and JetBrains Mono if installed, system fallbacks otherwise.
  Copy rules: open-weight models only, no closed model names, no price or discount claims.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../frontend/public/ire/theme.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background-image: radial-gradient(900px 520px at 100% 0%, var(--info-bg), transparent 70%);
  }
  .frame { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .kicker {
    font: 700 20px/1 "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    letter-spacing: .16em; text-transform: uppercase; color: var(--link);
  }
  h1 {
    margin: 34px 0 0; font-size: 104px; line-height: .98; letter-spacing: -.05em; font-weight: 850;
    max-width: 800px;
  }
  .sub { margin: 30px 0 0; font-size: 34px; line-height: 1.32; color: var(--muted-foreground); max-width: 700px; letter-spacing: -.01em; }
  .foot {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 26px;
    font: 700 22px/1 "JetBrains Mono", "SFMono-Regular", Consolas, monospace; color: var(--muted-foreground);
  }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--foreground); }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); }
  .url { color: var(--link); }
  /* The page's price ladder motif: a thin cheap ask against a deep one. No text on purpose. */
  .ladder { position: absolute; right: 72px; top: 150px; width: 300px; display: grid; gap: 18px; }
  .rung { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 26px 24px; box-shadow: var(--shadow); }
  .bar { height: 16px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; }
  .thin i { width: 4%; background: var(--bar-thin); }
  .deep i { width: 100%; background: var(--bar-deep); }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-bottom: 16px; }
  .thin .dot { background: var(--danger-fg); }
  .deep .dot { background: var(--success-fg); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="ladder" aria-hidden="true">
    <div class="rung thin"><div class="dot"></div><div class="bar"><i></i></div></div>
    <div class="rung deep"><div class="dot"></div><div class="bar"><i></i></div></div>
  </div>
  <div class="frame">
    <div class="kicker">Inference Recommendation Engine</div>
    <h1>IRE:<br>Today’s Picks</h1>
    <p class="sub">A daily list of open-weight models worth calling, with the reason behind every pick.</p>
    <div class="foot">
      <span class="brand"><span class="mark"></span>Design Baker</span>
      <span class="url">design-bakery.com/ire</span>
    </div>
  </div>
</body>
</html>
