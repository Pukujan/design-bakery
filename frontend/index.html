    <script>
      // Pre-paint theme: a stored choice wins, otherwise follow the OS.
      // The switcher that wrote the stored choice went with the old homepage; the choice still applies.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('mode');
          if (stored === 'dark' || stored === 'light') dark = stored === 'dark';
          else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (error) {
          /* storage blocked: fall back to light */
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
